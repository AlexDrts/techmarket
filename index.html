<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMarket · Online Store</title>
  <meta name="description" content="TechMarket: an online store demo built with vanilla JavaScript and ES modules">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true">T</span>TechMarket</a>
  <div class="search">
    <label for="search" class="visually-hidden">Search products</label>
    <input type="search" id="search" placeholder="Search products..." autocomplete="off">
  </div>
  <a href="cart.html" class="cart-link">
    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6"/></svg><span>Cart</span> <span class="badge" id="cartCount" hidden>0</span>
  </a>
</header>

<section class="hero" aria-labelledby="heroTitle">
  <div class="hero-text">
    <p class="hero-tag">New season · free demo shipping</p>
    <h1 id="heroTitle">Everything you need,<br>in one place</h1>
    <p class="hero-sub">Electronics, jewelry and clothing at honest prices. Add to cart and check out in a minute.</p>
    <a href="#products" class="btn btn-light">Shop now</a>
  </div>
  <svg class="hero-art" viewBox="0 0 360 260" role="img" aria-label="Shopping bag, laptop and phone illustration">
    <defs>
      <linearGradient id="gBag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
      <linearGradient id="gScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    </defs>
    <circle cx="180" cy="130" r="112" fill="#ffffff" opacity=".07"/>
    <circle cx="180" cy="130" r="76" fill="#ffffff" opacity=".07"/>
    <rect x="30" y="70" width="170" height="108" rx="10" fill="url(#gScreen)" stroke="#94a3b8" stroke-width="3"/>
    <rect x="42" y="82" width="146" height="84" rx="4" fill="#0b1220"/>
    <path d="M52 150l30-34 24 22 30-44 40 56z" fill="#38bdf8" opacity=".85"/>
    <circle cx="160" cy="102" r="8" fill="#fde68a"/>
    <path d="M14 178h202l-14 18H28z" fill="#94a3b8"/>
    <rect x="215" y="96" width="70" height="128" rx="12" fill="url(#gScreen)" stroke="#94a3b8" stroke-width="3"/>
    <rect x="223" y="110" width="54" height="86" rx="4" fill="#38bdf8" opacity=".25"/>
    <rect x="232" y="120" width="36" height="6" rx="3" fill="#e0f2fe"/>
    <rect x="232" y="134" width="26" height="6" rx="3" fill="#e0f2fe" opacity=".7"/>
    <circle cx="250" cy="210" r="5" fill="#94a3b8"/>
    <path d="M262 70h70l10 118a10 10 0 0 1-10 11h-70a10 10 0 0 1-10-11z" fill="url(#gBag)"/>
    <path d="M280 88v-8a17 17 0 0 1 34 0v8" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round"/>
    <path d="M285 130l12 12 22-26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</section>

<nav class="categories" id="categories" aria-label="Categories"></nav>

<main>
  <div class="toolbar">
    <p id="resultCount" aria-live="polite">Loading products…</p>
    <label class="sort">
      Sort by
      <select id="sort">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="rating">Top rated</option>
      </select>
    </label>
  </div>
  <p class="notice" id="notice" hidden></p>
  <div class="container" id="products">
    <div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div>
  </div>
</main>

<footer class="site-footer">
  Demo store · product data from <a href="https://fakestoreapi.com" target="_blank" rel="noopener">Fake Store API</a>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
