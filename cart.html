<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart · TechMarket</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true">T</span>TechMarket</a>
  <a href="index.html" class="back-link">← Back to store</a>
  <a href="cart.html" class="cart-link" aria-current="page">
    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6"/></svg><span>Cart</span> <span class="badge" id="cartCount" hidden>0</span>
  </a>
</header>

<main class="cart-page">
  <h1>Shopping cart</h1>

  <div id="cartItems" class="cart-items"></div>

  <div class="summary" id="summary" hidden>
    <span id="itemCount"></span>
    <span>Total: <strong id="total"></strong></span>
  </div>

  <section class="checkout" id="checkout" hidden aria-labelledby="checkoutTitle">
    <h2 id="checkoutTitle">Checkout</h2>

    <form id="orderForm" class="order-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" aria-describedby="nameError">
        <p class="error" id="nameError"></p>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+380 50 123 4567" aria-describedby="phoneError">
        <p class="error" id="phoneError"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailError">
        <p class="error" id="emailError"></p>
      </div>

      <div class="field">
        <label for="city">City</label>
        <select id="city" name="city">
          <option>Odesa</option>
          <option>Kyiv</option>
          <option>Lviv</option>
          <option>Kharkiv</option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>Delivery</legend>
        <label><input type="radio" name="delivery" value="Nova Poshta" checked> Nova Poshta</label>
        <label><input type="radio" name="delivery" value="Ukrposhta"> Ukrposhta</label>
      </fieldset>

      <fieldset class="form-group">
        <legend>Extras</legend>
        <label><input type="checkbox" id="gift" name="gift"> Gift wrapping</label>
        <label><input type="checkbox" id="insurance" name="insurance"> Shipping insurance</label>
      </fieldset>

      <button type="submit" class="btn btn-primary btn-wide" id="submitBtn">Place order</button>
    </form>

    <ol class="order-progress" id="orderProgress" hidden aria-live="polite"></ol>
  </section>
</main>

<script type="module" src="js/cartPage.js"></script>
</body>
</html>
